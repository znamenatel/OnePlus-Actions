name: Build ReSukiSU

on:
  workflow_dispatch:
    inputs:
      KERNEL_VERSION:
        description: 'Выберите версию ядра / 选择内核版本'
        required: true
        default: '6.6'
        type: choice
        options:
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "🚚 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔧 Setup Environment"
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache flex glibc-source libelf-dev libssl-dev link-grammar lld llvm make openssl python3 python3-pip

      - name: "⚙️ Cache ccache"
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.event.inputs.KERNEL_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.event.inputs.KERNEL_VERSION }}-

      - name: "🔨 Build Kernel | 编译内核"
        run: |
          echo "🏗️ Начинаю сборку ядра..."
          export KBUILD_BUILD_USER="xiaoxiaow"
          export KBUILD_BUILD_HOST="xiaoxiaow_build"

          # Функция для инжекта заголовков SUSFS
          inject_susfs() {
            cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common
            echo "🎯 Инжект заголовков SUSFS в файлы..."
            for file in fs/open.c fs/stat.c fs/namei.c; do
              if [ -f "$file" ]; then
                if ! grep -q "<linux/susfs.h>" "$file"; then
                  sed -i '1i #include <linux/susfs.h>' "$file"
                  echo "✅ Добавлено в $file"
                fi
              fi
            done
          }

          if [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.6" ]; then
            sudo apt update && sudo apt install -y libelf-dev clang lld llvm ccache
            
            # Настройка путей для LLVM
            mkdir -p $GITHUB_WORKSPACE/sys_bin
            for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
              ln -sf /usr/bin/$tool-$(clang --version | grep -oE 'version [0-9]+' | awk '{print $2}') $GITHUB_WORKSPACE/sys_bin/$tool
            done
            export PATH="$GITHUB_WORKSPACE/sys_bin:$PATH"

            # Умный перехватчик DTC
            TOOLS_DIR="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/kernel-build-tools/linux-x86"
            if [ -f "$TOOLS_DIR/bin/dtc" ]; then
              mv "$TOOLS_DIR/bin/dtc" "$TOOLS_DIR/bin/dtc.orig"
              echo -e '#!/bin/bash\nif echo "$@" | grep -q "sm8650"; then exec "$(dirname "$0")/dtc.orig" "$@"; else exit 0; fi' > "$TOOLS_DIR/bin/dtc"
              chmod +x "$TOOLS_DIR/bin/dtc"
            fi

            inject_susfs
            
            make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CC="ccache clang" HOSTCC="ccache clang" \
              AR="llvm-ar" NM="llvm-nm" LD="ld.lld" \
              KCFLAGS="-O2 -Wno-error" HOSTCFLAGS="-Wno-error" \
              gki_defconfig all

          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.1" ]; then
            cd kernel_workspace/kernel_platform/common
            inject_susfs
            make -j$(nproc) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out gki_defconfig all

          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.15" ]; then
            cd kernel_workspace/kernel_platform/common
            inject_susfs
            make -j$(nproc) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out gki_defconfig all
            
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.10" ]; then
            cd kernel_workspace/kernel_platform/common
            inject_susfs
            make -j$(nproc) LLVM_IAS=1 LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out gki_defconfig all
          fi
          
          echo "✅ Сборка завершена"
