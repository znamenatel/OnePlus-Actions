name: Build ReSukiSU-gt5pro
on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "CPU分支"
        required: true
        type: choice
        options:
          - 'sm8750'
          - 'sm8735'
          - 'mt6991'
          - 'sm8650'
          - 'mt6989'
          - 'sm8635'
          - 'sm8550'
          - 'sm8450'
          - 'sm8475'
          - 'sm7675'
          - 'sm7635'
          - 'sm7550'
          - 'sm6375'
        default: 'sm8650'

      FEIL:
        description: "手机型号"
        required: true
        type: choice
        options:
          - 'gt5pro'
          - 'oneplus_13_b'
          - 'oneplus_13s_b'
          - 'oneplus_13t_b'
          - 'oneplus_ace5_pro_b'
          - 'oneplus_ace_6'
          - 'oneplus_pad_2_pro_b'
          - 'oneplus_pad_3_b'
          - 'oneplus_ace5_ultra_b'
          - 'oneplus_nord_6'
          - 'oneplus_turbo_6'
          - 'oneplus_12_b'
          - 'oneplus_ace3_pro_b'
          - 'oneplus_ace5_b'
          - 'oneplus_13r_b'
          - 'oneplus_pad2_b'
          - 'oneplus_pad_pro_b'
          - 'oneplus_ace5_race_b'
          - 'oneplus_nord_5_b'
          - 'oneplus_11_b'
          - 'oneplus_12r_b'
          - 'oneplus_ace2_pro_b'
          - 'oneplus_ace3_b'
          - 'oneplus_open_b'
          - 'oneplus_10t_v'
          - 'oneplus_11r_b'
          - 'oneplus_ace2_b'
          - 'oneplus_ace_pro_v'
          - 'oneplus_10_pro_b'
          - 'oneplus_ace_3v_b'
          - 'oneplus_turbo_6v'
          - 'oneplus_nord_4_b'
          - 'oneplus_nord_ce4_lite_5g'
          - 'oneplus_nord_ce4_b'
        default: 'oneplus_12_b'

      ANDROID_VERSION:
        description: "内核安卓KMI版本"
        required: true
        type: choice
        options:
          - 'android15'
          - 'android14'
          - 'android13'
          - 'android12'
        default: 'android15'

      KERNEL_VERSION:
        description: "内核版本"
        required: true
        type: choice
        options:
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'
        default: '6.1'

      SUSFS:
        description: "是否启用SUSFS"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      lz4kd:
        description: "是否启用lz4kd(6.1 关闭时使用 lz4 + zstd; 6.6 关闭时使用 lz4)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      bbg:
        description: "是否启用BBG基带保护"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'

      bbr:
        description: "是否启用BBR算法(对手机日用无太大意义甚至可能负优化)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      proxy:
        description: "是否添加代理性能优化(联发科芯片跑的时候请关闭否则出现恶性问题)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'

      UNICODE_BYPASS:
        description: "是否添加Unicode零宽绕过修复补丁(除5.10版本外版本不推荐开启, 建议使用 https://t.me/real5ec1cff/271 无痛修复)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

jobs:
  build:
    name: For ${{ github.event.inputs.FEIL }} KPM ${{ github.event.inputs.KPM }} lz4kd ${{ github.event.inputs.lz4kd }} SUSFS ${{ github.event.inputs.SUSFS }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G

    steps:
      - name: "🚀 Maximize Build Space | 最大化构建空间"
        if: ${{ github.event.inputs.KERNEL_VERSION == '5.10' || github.event.inputs.KERNEL_VERSION == '5.15' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "⚙️ Setup Cache Env | 设置缓存环境"
        run: |
          echo "🔧 正在设置机型隔离缓存目录..."
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FEIL }}_ReSukiSU" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FEIL }}_ReSukiSU"
          echo "✅ 缓存目录已设置: $HOME/.ccache_${{ github.event.inputs.FEIL }}_ReSukiSU"

      - name: "🔐 Configure Git | 配置Git账户"
        run: |
          echo "🔧 正在配置Git用户信息..."
          git config --global user.name "build"
          git config --global user.email "2210077278@qq.com"
          echo "✅ Git配置完成"

      - name: "📦 Install Dependencies | 安装构建依赖"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix clang lld device-tree-compiler

      - name: "💾 Restore ccache (With SUSFS) | 恢复ccache缓存 (With SUSFS)"
        if: ${{ github.event.inputs.SUSFS == 'On' }}
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.event.inputs.FEIL }}-ReSukiSU-SUSFS
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.FEIL }}-ReSukiSU-SUSFS
            ccache-${{ runner.os }}-ReSukiSU-SUSFS

      - name: "💾 Restore ccache (Without SUSFS) | 恢复ccache缓存 (Without SUSFS)"
        if: ${{ github.event.inputs.SUSFS == 'Off' }}
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.event.inputs.FEIL }}-ReSukiSU-NoSUSFS
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.FEIL }}-ReSukiSU-NoSUSFS
            ccache-${{ runner.os }}-ReSukiSU-NoSUSFS

      - name: "⚙️ Initialize ccache | 初始化ccache"
        run: |
          echo "🔧 正在初始化ccache..."
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache初始化完成"
            else
              echo "ℹ️ ccache已存在，跳过初始化"
            fi
          else
            echo "⚠️ 未找到ccache命令，跳过初始化"
          fi
          ccache -s
          echo "✅ ccache初始化流程完成"

      - name: "📥 Install Repo Tool | 安装Repo工具"
        run: |
          echo "⬇️ 正在下载repo工具..."
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          echo "✅ repo工具安装完成"

      - name: "⬇️ Clone Kernel Source | 克隆内核源码"
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          echo "🌐 正在初始化内核仓库..."
          if [ "${{ github.event.inputs.FEIL }}" = "gt5pro" ]; then
            repo init -u https://github.com/Xiaomichael/kernel_manifest.git -b refs/heads/oneplus/${{ github.event.inputs.CPU }} -m oneplus_12_b.xml --depth=1
          else
            repo init -u https://github.com/Xiaomichael/kernel_manifest.git -b refs/heads/oneplus/${{ github.event.inputs.CPU }} -m ${{ github.event.inputs.FEIL }}.xml --depth=1
          fi
          echo "🔄 Синхронизируем исходники с защитой от сбоев сервера (2 потока)..."
          for i in {1..5}; do
            repo sync -c -j2 --fail-fast --force-sync --no-clone-bundle --no-tags && break || {
              echo "⚠️ Сервер CodeLinaro выдал ошибку. Пробую еще раз через 30 секунд (Попытка $i из 5)..."
              sleep 30
            }
          done
          echo "✅ 内核源码克隆完成"
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"
          echo "🔧 正在配置内核版本信息..."
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/common/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/external/dtc/scripts/setlocalversion
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.6" ]; then
            sed -i '$s|echo "\$res"|echo "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/common/scripts/setlocalversion
            sed -i '$s|echo "\$res"|echo "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/msm-kernel/scripts/setlocalversion
            sed -i '$s|echo "\$res"|echo "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/external/dtc/scripts/setlocalversion
          else
            ESCAPED_SUFFIX=$(printf '%s\n' "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow" | sed 's:[\/&]:\\&:g')
            sudo sed -i "s/-4k/$ESCAPED_SUFFIX/g" kernel_platform/common/arch/arm64/configs/gki_defconfig
            sed -i 's/${scm_version}//' kernel_platform/common/scripts/setlocalversion
            sed -i 's/${scm_version}//' kernel_platform/msm-kernel/scripts/setlocalversion
          fi
          echo "✅ 内核配置完成"

      - name: "⚡ Setup Baseband-guard | 配置 Baseband-guard"
        if: ${{ github.event.inputs.bbg == 'On' && github.event.inputs.KPM == 'Off' }}
        run: |
          set -e
          cd kernel_workspace/kernel_platform/common
          echo "🛠️ 正在设置BBG..."
          curl -sSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o setup.sh
          bash setup.sh

      - name: "⚡ Setup ReSukiSU | 配置 ReSukiSU"
        run: |
          cd kernel_workspace/kernel_platform
          echo "🛠️ 正在设置ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          cd KernelSU
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 30700)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          echo "✅ ReSukiSU 配置完成"

      - name: "🔧 Setup Patches | 配置补丁"
        env:
          PYTHON_PATCH_SCRIPT: |
            import re
            import os

            patch_name = "50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch"

            if os.path.exists(patch_name):
                with open(patch_name, "r") as f:
                    lines = f.readlines()
                new_lines = []
                skip = False
                for line in lines:
                    if (line.startswith("diff --git a/mm/memory.c") or line.startswith("diff --git a/common/mm/memory.c") or
                        line.startswith("diff --git a/fs/namespace.c") or line.startswith("diff --git a/common/fs/namespace.c") or
                        line.startswith("diff --git a/fs/stat.c") or line.startswith("diff --git a/common/fs/stat.c") or
                        line.startswith("diff --git a/fs/proc/task_mmu.c") or line.startswith("diff --git a/common/fs/proc/task_mmu.c")):
                        skip = True
                    elif line.startswith("diff --git "):
                        skip = False
                    if not skip:
                        new_lines.append(line)
                with open(patch_name, "w") as f:
                    f.writelines(new_lines)
                print("✅ Из файла патча успешно удалены конфликтные секции VFS и Procfs")

            if os.path.exists("mm/memory.c"):
                with open("mm/memory.c", "r") as f:
                    code = f.read()
                if "#include <linux/susfs.h>" not in code:
                    code = code.replace("#include <linux/memory.h>", "#include <linux/memory.h>\n#include <linux/susfs.h>")
                susfs_block = (
                    "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                    "        struct page *page = NULL;\n\n"
                    "        if (vma && vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
                    "            break;\n\n"
                    "        page = get_user_page_vma_remote(mm, addr, gup_flags, &vma);\n"
                    "#else\n"
                    "        struct page *page = get_user_page_vma_remote(mm, addr, gup_flags, &vma);\n"
                    "#endif"
                )
                pattern = r"struct page\s*\*page\s*=\s*get_user_page_vma_remote\s*\(\s*mm\s*,\s*addr\s*,\s*\n?\s*gup_flags\s*,\s*&vma\s*\)\s*;"
                code, count = re.subn(pattern, susfs_block, code)
                if count == 0:
                    pattern_fallback = r"struct page\s*\*page\s*=\s*get_user_page_vma_remote\s*\([^;]+&vma\s*\)\s*;"
                    code, count = re.subn(pattern_fallback, susfs_block, code)
                with open("mm/memory.c", "w") as f:
                    f.write(code)
                print(f"✅ Файл mm/memory.c изменен напрямую. Замен: {count}")

            if os.path.exists("fs/namespace.c"):
                with open("fs/namespace.c", "r") as f:
                    code = f.read()
                if "CONFIG_KSU_SUSFS_SUS_MOUNT" not in code:
                    code = code.replace(
                        "#include <linux/mnt_idmapping.h>",
                        "#include <linux/mnt_idmapping.h>\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux/susfs_def.h>\n#endif"
                    )
                    susfs_ns_block = (
                        "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                        "extern bool susfs_is_current_ksu_domain(void);\n"
                        "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n"
                        "#define CL_COPY_MNT_NS_BIT(25) /* used by copy_mnt_ns() */\n\n"
                        "#endif\n\n"
                    )
                    code = code.replace("static unsigned int sysctl_mount_max", susfs_ns_block + "static unsigned int sysctl_mount_max")
                with open("fs/namespace.c", "w") as f:
                    f.write(code)
                print("✅ Файл fs/namespace.c успешно модифицирован напрямую")

            if os.path.exists("fs/stat.c"):
                with open("fs/stat.c", "r") as f:
                    code = f.read()
                if "CONFIG_KSU_SUSFS_SUS_KSTAT" not in code:
                    pattern_stat = r"if\s*\(\s*inode\s*->\s*i_op\s*->\s*getattr\s*\)\s*return\s+inode\s*->\s*i_op\s*->\s*getattr\s*\(\s*idmap\s*,\s*path\s*,\s*stat\s*,\s*request_mask\s*,\s*query_flags\s*\|\s*AT_GETATTR_NOSEC\s*\)\s*;"
                    susfs_stat_block = (
                        "if (inode->i_op->getattr)\n"
                        "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                        "\t{\n"
                        "\t\tint err = inode->i_op->getattr(idmap, path, stat,\n"
                        "\t\t\t\t\t\t request_mask,\n"
                        "\t\t\t\t\t\t query_flags | AT_GETATTR_NOSEC);\n"
                        "\t\tif (!err)\n"
                        "\t\t\tsusfs_sys_kstat_spoof_generic_fillattr(inode, stat);\n"
                        "\t\treturn err;\n"
                        "\t}\n"
                        "#else\n"
                        "\t\treturn inode->i_op->getattr(idmap, path, stat,\n"
                        "\t\t\t\t\t\t     request_mask,\n"
                        "\t\t\t\t\t\t     query_flags | AT_GETATTR_NOSEC);\n"
                        "#endif"
                    )
                    code, count = re.subn(pattern_stat, susfs_stat_block, code)
                    print(f"✅ Файл fs/stat.c изменен напрямую. Замен: {count}")
                with open("fs/stat.c", "w") as f:
                    f.write(code)

            if os.path.exists("fs/proc/task_mmu.c"):
                with open("fs/proc/task_mmu.c", "r") as f:
                    code = f.read()
                if "CONFIG_KSU_SUSFS_SUS_MAP" not in code:
                    pattern_mmu = r"/\*\s*Case\s+4\s+above\s*\*/\s*if\s*\(\s*vma\s*->\s*vm_end\s*>\s*last_vma_end\s*\)\s*\{\s*smap_gather_stats\s*\(\s*vma\s*,\s*&mss\s*,\s*last_vma_end\s*\)\s*;\s*last_vma_end\s*=\s*vma\s*->\s*vm_end\s*;\s*\}"
                    susfs_mmu_block = (
                        "/* Case 4 above */\n"
                        "\t\tif (vma->vm_end > last_vma_end) {\n"
                        "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                        "\t\t\tif (!vma->vm_file || !(SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))) {\n"
                        "\t\t\t\tsmap_gather_stats(vma, &mss, last_vma_end);\n"
                        "\t\t\t\tlast_vma_end = vma->vm_end;\n"
                        "\t\t\t}\n"
                        "#else\n"
                        "\t\t\tsmap_gather_stats(vma, &mss, last_vma_end);\n"
                        "\t\t\tlast_vma_end = vma->vm_end;\n"
                        "#endif\n"
                        "\t\}"
                    )
                    code, count = re.subn(pattern_mmu, susfs_mmu_block, code)
                    print(f"✅ Файл fs/proc/task_mmu.c изменен напрямую. Замен: {count}")
                with open("fs/proc/task_mmu.c", "w") as f:
                    f.write(code)
        run: |
          cd kernel_workspace
          echo "⬇️ 克隆所需补丁..."
          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            git clone https://github.com/cctv18/susfs4oki.git -b oki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          fi
          git clone https://github.com/Xiaomichael/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          echo "📝 复制补丁文件..."
          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            cp ../susfs4oki/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch ./common/
            cp ../susfs4oki/kernel_patches/fs/* ./common/fs/
            cp ../susfs4oki/kernel_patches/include/linux/* ./common/include/linux/
          else
            cp ../kernel_patches/sukisu/scope_min_manual_hooks_v1.9.patch ./common/
          fi
          cp ../kernel_patches/zram_patches/001-lz4.patch ./common/
          cp ../kernel_patches/zram_patches/lz4armv8.S ./common/lib
          cp ../kernel_patches/zram_patches/002-zstd.patch ./common/
          if [ "${{ github.event.inputs.UNICODE_BYPASS }}" = "On" ]; then
            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
              cp ../kernel_patches/common/unicode_bypass_fix_6.1+.patch ./common/unicode_bypass_fix.patch
            elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ]; then
              cp ../kernel_patches/common/unicode_bypass_fix_6.1-.patch ./common/unicode_bypass_fix.patch
            fi
          fi
          if [ "${{ github.event.inputs.lz4kd }}" == "On" ]; then
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi
          cd ./common
          if [ "${{ github.event.inputs.UNICODE_BYPASS }}" = "On" ]; then
            patch -p1 < unicode_bypass_fix.patch
          fi
          if [ "${{ github.event.inputs.lz4kd }}" = "Off" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ]; then
            git apply -p1 < 001-lz4.patch || true
          fi
          if [ "${{ github.event.inputs.lz4kd }}" = "Off" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
            git apply -p1 < 001-lz4.patch || true
          fi
          if [ "${{ github.event.inputs.lz4kd }}" == "On" ]; then
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4kd.patch ./
            patch -p1 -F 3 < lz4kd.patch || true
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4k_oplus.patch ./
            patch -p1 -F 3 < lz4k_oplus.patch || true
          fi

          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            printenv PYTHON_PATCH_SCRIPT > patch_all.py
            python3 patch_all.py
            rm patch_all.py
            if ! patch -p1 -F 3 < 50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch; then
              find . -name "*.rej" -exec echo "--- Файл: {} ---" \; -exec cat {} \;
              exit 1
            fi
          else
            patch -p1 -F 3 < scope_min_manual_hooks_v1.9.patch
          fi

          echo "🩹 Проверяю и чиню avc_has_perm в hooks.c..."
          HOOKS_FILE="security/selinux/hooks.c"
          if [ -f "$HOOKS_FILE" ]; then
            if grep -q "avc_has_perm(mysid, mysid, SECCLASS_PROCESS," "$HOOKS_FILE"; then
              sed -i 's/avc_has_perm(mysid, mysid, SECCLASS_PROCESS,/avc_has_perm(\&selinux_state, mysid, mysid, SECCLASS_PROCESS,/' "$HOOKS_FILE"
              echo "✅ hooks.c пофиксен (добавлен &selinux_state)"
            fi
          fi

          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            echo "🔧 Аккуратно внедряю инклуд SUSFS во все файлы, где он используется..."
            FILES_TO_FIX=$(grep -rlE '\b(susfs_[a-zA-Z_]+|SUSFS_[A-Z_]+)\(' --include="*.c" fs/ security/ 2>/dev/null | xargs grep -L "linux/susfs.h" 2>/dev/null || true)
            if [ -n "$FILES_TO_FIX" ]; then
              for f in $FILES_TO_FIX; do
                LAST_INC=$(grep -n '^#include' "$f" | tail -1 | cut -d: -f1)
                if [ -n "$LAST_INC" ]; then
                  sed -i "${LAST_INC}a #include <linux/susfs.h>" "$f"
                  echo "✅ $f пофиксен (include добавлен после строки $LAST_INC)"
                fi
              done
            else
              echo "ℹ️ Файлов, требующих фикса, не найдено"
            fi
          fi

          echo "✅ 所有补丁应用完成"

      - name: Apply SCHED Patch | 应用风驰补丁
        if: ${{ github.event.inputs.FEIL != 'gt5pro' && false }}
        run: |
          cd kernel_workspace/kernel_platform/common
          if [ "${{ github.event.inputs.FEIL }}" == "oneplus_ace5_ultra" ] || [ "${{ github.event.inputs.FEIL }}" = "oneplus_ace5_ultra_b" ]; then
              git clone https://github.com/Numbersf/SCHED_PATCH.git -b "mt6991"
          else
              git clone https://github.com/Numbersf/SCHED_PATCH.git -b "sm8750"
          fi
          cp ./SCHED_PATCH/fengchi_${{ github.event.inputs.FEIL }}.patch ./
          if [[ -f "fengchi_${{ github.event.inputs.FEIL }}.patch" ]]; then
            dos2unix "fengchi_${{ github.event.inputs.FEIL }}.patch"
            patch -p1 -F 3 < "fengchi_${{ github.event.inputs.FEIL }}.patch"
          else
            sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
            wget https://github.com/Numbersf/Action-Build/raw/SukiSU-Ultra/patches/hmbird_patch.patch
            patch -p1 -F 3 < hmbird_patch.patch
          fi

      - name: "⚙️ Configure Kernel Options | 配置内核选项"
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform
          curl -L -o resukisu_setup.bin https://github.com/Xiaomichael/OnePlus-Actions/raw/Build/script/resukisu_setup.bin
          chmod +x resukisu_setup.bin
          ./resukisu_setup.bin
          rm -rf ./resukisu_setup.bin

          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig
          else
            echo "CONFIG_KSU_SUSFS=n" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig

          if [ "${{ github.event.inputs.bbg }}" == "On" ] && [ "${{ github.event.inputs.KPM }}" == "Off" ]; then
            echo 'CONFIG_BBG=y' >> ./common/arch/arm64/configs/gki_defconfig
            echo 'CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"' >> ./common/arch/arm64/configs/gki_defconfig
          fi

          if [ "${{ github.event.inputs.bbr }}" == "On" ]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_SCH_FQ=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BIC=n" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_WESTWOOD=n" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_HTCP=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          if [ "${{ github.event.inputs.lz4kd }}" == "On" ]; then
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K_OPLUS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_WRITEBACK=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          if [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.1" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.6" ]; then
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          if [ "${{ github.event.inputs.proxy }}" == "On" ]; then
            echo "CONFIG_BPF_STREAM_PARSER=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ]; then
            DEFCONFIG=./common/arch/arm64/configs/gki_defconfig
            sed -i 's/^CONFIG_LTO=n/CONFIG_LTO=y/' "$DEFCONFIG"
            sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG"
            sed -i 's/^CONFIG_LTO_CLANG_NONE=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG"
            grep -q '^CONFIG_LTO_CLANG_THIN=y' "$DEFCONFIG" || echo 'CONFIG_LTO_CLANG_THIN=y' >> "$DEFCONFIG"
          fi

          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki
          echo "✅ 内核配置更新完成"

      - name: "🔨 Build Kernel | 编译内核"
        run: |
          echo "🏗️ Начинаю сборку ядра..."
          export KBUILD_BUILD_USER="xiaoxiaow"
          export KBUILD_BUILD_HOST="xiaoxiaow_build"

          EXTRA_CFLAGS="-O2 -Wno-error"

          if [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.6" ]; then
            sudo apt update && sudo apt install -y libelf-dev clang lld llvm ccache

            mkdir -p $GITHUB_WORKSPACE/sys_bin
            SYS_LLVM_VER=$(clang --version | grep -oE 'version [0-9]+' | awk '{print $2}')
            for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
              ln -sf /usr/bin/$tool-$SYS_LLVM_VER $GITHUB_WORKSPACE/sys_bin/$tool
            done
            export PATH="$GITHUB_WORKSPACE/sys_bin:$PATH"

            cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common

            echo "📝 Генерирую дефконфиг..."
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig

            echo "🎯 Сборка DTBS..."
            make -i -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CC="ccache clang" HOSTCC="ccache clang" \
              AR="llvm-ar" NM="llvm-nm" LD="ld.lld" \
              dtbs || true

            echo "🚀 Запуск финальной компиляции ядра..."
            make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CC="ccache clang" HOSTCC="ccache clang" \
              AR="llvm-ar" NM="llvm-nm" LD="ld.lld" \
              HOSTAR="llvm-ar" HOSTNM="llvm-nm" HOSTLD="ld.lld" \
              RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc \
              PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole \
              KCFLAGS="$EXTRA_CFLAGS" HOSTCFLAGS="-Wno-error" \
              all

          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.1" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r487747c/bin:$PATH"
            export PATH="/usr/lib/ccache:$PATH"
            sudo apt install -y libelf-dev
            cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common
            make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS="$EXTRA_CFLAGS" HOSTCFLAGS="-Wno-error" gki_defconfig all

          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.15" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
            export PATH="/usr/lib/ccache:$PATH"
            sudo apt install -y libelf-dev
            cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common
            make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS="$EXTRA_CFLAGS" HOSTCFLAGS="-Wno-error" gki_defconfig all

          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.10" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PATH"
            export PATH="/usr/lib/ccache:$PATH"
            sudo apt install -y libelf-dev
            cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common
            make -j$(nproc --all) LLVM_IAS=1 LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS="$EXTRA_CFLAGS" HOSTCFLAGS="-Wno-error" gki_defconfig all
          fi

          ccache -s
          echo "✅ Процесс сборки завершен!"
